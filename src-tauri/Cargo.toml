[package]
name = "clipture"
version = "0.1.0"
description = "Low-friction game capture powered by libobs-rs"
authors = ["sshcrack"]
edition = "2024"

[lib]
name = "clipture_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "clipture"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }
libobs-bootstrapper = { git = "https://github.com/libobs-rs/libobs-rs", branch = "main" }

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
directories = "6"
display-info = "0.5"
ffmpeg-sidecar = "2"
log = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

# The application intentionally follows upstream main. libobs-rs is maintained alongside Clipture.
libobs-simple = { git = "https://github.com/libobs-rs/libobs-rs", branch = "main" }
libobs-wrapper = { git = "https://github.com/libobs-rs/libobs-rs", branch = "main", default-features = false, features = ["enable_runtime", "logging_crash_handler"] }
libobs-window-helper = { git = "https://github.com/libobs-rs/libobs-rs", branch = "main" }
libobs-bootstrapper = { git = "https://github.com/libobs-rs/libobs-rs", branch = "main" }

tauri = { version = "2.11", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-log = "2.9"
tauri-plugin-notification = "2.4"
tauri-plugin-opener = "2.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
